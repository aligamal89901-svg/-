name: Build NASAQ Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run:         INSTALLED_NDK=$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null | sort -V | tail -n 1)
        if [ -n "$INSTALLED_NDK" ]; then
          echo "Using pre-installed NDK: $INSTALLED_NDK"
          sed -i "s/ndkVersion = .*/ndkVersion = \"$INSTALLED_NDK\"/g" android/app/build.gradle.kts 2>/dev/null || true
          sed -i "s/ndkVersion .*/ndkVersion \"$INSTALLED_NDK\"/g" android/app/build.gradle 2>/dev/null || true
        fi
        flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasaq-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
